name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: |
          dotnet restore InventoryApi.csproj
          dotnet restore tests/InventoryApi.Tests/InventoryApi.Tests.csproj

      - name: Build
        run: |
          dotnet build InventoryApi.csproj --configuration Release --no-restore
          dotnet build tests/InventoryApi.Tests/InventoryApi.Tests.csproj --configuration Release --no-restore

      - name: Run tests
        run: dotnet test tests/InventoryApi.Tests/InventoryApi.Tests.csproj --configuration Release --no-build
